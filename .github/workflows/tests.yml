name: Tests de non-régression

# Sur chaque pull request (et à la demande, onglet Actions, pour une branche
# sans PR). Pas de déclencheur « push » sur les branches : avec une PR ouverte,
# chaque push lançait les tests deux fois (push + pull_request), ce qui doublait
# les minutes macOS. Sur main, ce workflow est appelé par « Compilation Android
# et iOS » (build.yml) : l'APK et l'app iOS ne sont compilés que si tous les
# tests passent.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Droits minimaux : les tests ne font que lire le code.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  web:
    name: Site web (Chromium ordinateur + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapport-tests-web
          path: playwright-report/

  web-safari:
    name: Site web (WebKit / Safari iPhone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npx playwright test --project=iphone-webkit
        env:
          PW_WEBKIT: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapport-tests-safari
          path: playwright-report/

  flutter:
    name: App Flutter (tests unitaires et d'interface)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rhythmix_golf_flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Préparer le projet
        run: bash tool/bootstrap.sh
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test

  android:
    name: Android (émulateur, décodage vidéo natif)
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Activer KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Préparer le projet
        working-directory: rhythmix_golf_flutter
        run: bash tool/bootstrap.sh
      - name: Tests sur émulateur Android 14
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: rhythmix_golf_flutter
          script: flutter test integration_test -d emulator-5554 --reporter expanded

  ios:
    name: iOS (simulateur, décodage vidéo natif)
    needs: flutter
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rhythmix_golf_flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Préparer le projet
        run: bash tool/bootstrap.sh
      - name: Démarrer un simulateur d'iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulateur : $UDID"
          xcrun simctl boot "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      # Il arrive que l'app se lance sur le simulateur sans que les tests
      # démarrent jamais (Flutter n'arrive pas à s'y connecter) : l'étape
      # restait alors bloquée jusqu'à la limite de 45 min du job. On coupe donc
      # chaque essai au bout de 15 min (un passage normal prend ~9 min) et,
      # seulement dans ce cas, on redémarre le simulateur et on réessaie une
      # fois. Un vrai échec de test n'est pas relancé.
      - name: Tests sur simulateur iOS
        run: |
          LIMITE=900  # secondes par essai
          for essai in 1 2; do
            rm -f "$RUNNER_TEMP/bloque"
            flutter test integration_test -d "$SIM_UDID" --reporter expanded &
            pid=$!
            ( sleep "$LIMITE"
              touch "$RUNNER_TEMP/bloque"
              echo "::warning::Essai $essai bloqué après $((LIMITE / 60)) min : arrêt des tests."
              pkill -TERM -P "$pid" 2>/dev/null; kill -TERM "$pid" 2>/dev/null
              sleep 15
              pkill -KILL -P "$pid" 2>/dev/null; kill -KILL "$pid" 2>/dev/null ) &
            garde=$!
            code=0
            wait "$pid" || code=$?
            pkill -P "$garde" 2>/dev/null || true
            kill "$garde" 2>/dev/null || true
            if [ ! -f "$RUNNER_TEMP/bloque" ]; then
              exit "$code"  # terminé à temps : succès ou vrai échec
            fi
            if [ "$essai" = 1 ]; then
              echo "Redémarrage du simulateur avant le second essai"
              xcrun simctl shutdown "$SIM_UDID" || true
              xcrun simctl boot "$SIM_UDID"
            fi
          done
          echo "::error::Les tests iOS sont restés bloqués deux fois de suite."
          exit 1
