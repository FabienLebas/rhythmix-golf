name: Tests de non-régression

# Sur chaque branche et chaque pull request. Sur main, ce workflow est appelé
# par « Compilation Android et iOS » (build.yml) : l'APK et l'app iOS ne sont
# compilés que si tous les tests passent.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  web:
    name: Site web (Chromium ordinateur + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-tests-web
          path: playwright-report/

  web-safari:
    name: Site web (WebKit / Safari iPhone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npx playwright test --project=iphone-webkit
        env:
          PW_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-tests-safari
          path: playwright-report/

  flutter:
    name: App Flutter (tests unitaires et d'interface)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rhythmix_golf_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Préparer le projet
        run: bash tool/bootstrap.sh
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test

  android:
    name: Android (émulateur, décodage vidéo natif)
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Activer KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Préparer le projet
        working-directory: rhythmix_golf_flutter
        run: bash tool/bootstrap.sh
      - name: Tests sur émulateur Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: rhythmix_golf_flutter
          script: flutter test integration_test -d emulator-5554 --reporter expanded

  ios:
    name: iOS (simulateur, décodage vidéo natif)
    needs: flutter
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rhythmix_golf_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Préparer le projet
        run: bash tool/bootstrap.sh
      - name: Démarrer un simulateur d'iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulateur : $UDID"
          xcrun simctl boot "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Tests sur simulateur iOS
        run: flutter test integration_test -d "$SIM_UDID" --reporter expanded
