name: Compilation Android et iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimaux : le workflow ne fait que lire le code.
permissions:
  contents: read

# Le projet Flutter est dans le sous-dossier rhythmix_golf_flutter/
defaults:
  run:
    working-directory: rhythmix_golf_flutter

jobs:
  # Tests de non-régression (site, Flutter, Android, iOS) : rien n'est compilé
  # pour les stores s'ils échouent.
  tests:
    uses: ./.github/workflows/tests.yml

  android:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Préparer le projet
        run: bash tool/bootstrap.sh
      - name: Compiler l'APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rhythmix-golf-android
          path: rhythmix_golf_flutter/build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Préparer le projet
        run: bash tool/bootstrap.sh
      - name: Compiler l'app iOS (sans signature)
        run: flutter build ios --release --no-codesign
      - name: Emballer en .ipa non signé
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr rhythmix-golf-non-signe.ipa Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rhythmix-golf-ios
          path: rhythmix_golf_flutter/rhythmix-golf-non-signe.ipa
