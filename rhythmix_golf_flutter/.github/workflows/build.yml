name: Compilation Android et iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Préparer le projet
        run: bash tool/bootstrap.sh
      - name: Compiler l'APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: rhythmix-golf-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Préparer le projet
        run: bash tool/bootstrap.sh
      - name: Compiler l'app iOS (sans signature)
        run: flutter build ios --release --no-codesign
      - name: Emballer en .ipa non signé
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr rhythmix-golf-non-signe.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: rhythmix-golf-ios
          path: rhythmix-golf-non-signe.ipa
