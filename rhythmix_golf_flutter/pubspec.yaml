name: rhythmix_golf
description: "Rhythmix Golf : métronome de tempo de swing (3:1 grand jeu, 2:1 putting) et analyse vidéo automatique."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ">=0.9.40 <0.11.0"
  audio_session: ">=0.1.21 <0.3.0"
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  image_picker: ^1.1.0
  # Achat intégré unique (déblocage après les analyses gratuites)
  in_app_purchase: ^3.2.0
  # Plugin local (décodage vidéo natif), généré par tool/bootstrap.sh
  rhythmix_native:
    path: packages/rhythmix_native
  # Écran de démarrage : maintenu un peu plus longtemps au lancement
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  # Tests de non-régression (voir test/ et integration_test/)
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Pour simuler la caméra / galerie dans les tests de widgets
  image_picker_platform_interface: ^2.10.0
  # Pour simuler l'App Store / Google Play dans les tests
  in_app_purchase_platform_interface: ^1.4.0
  # Temps simulé (relance du métronome, délai de restauration)
  fake_async: ^1.3.1

# Icônes d'app (App Store / Play Store), générées par tool/bootstrap.sh
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_foreground.png

# Écran de démarrage (logo complet sur fond blanc), généré par tool/bootstrap.sh
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo_full.png
  color_dark: "#FFFFFF"
  image_dark: assets/logo_full.png
  android_12:
    # Android 12+ : logo dans un cercle, on y met le logo sans texte
    color: "#FFFFFF"
    image: assets/icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo_full.png
