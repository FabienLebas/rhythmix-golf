name: rhythmix_golf
description: "Rhythmix Golf : métronome de tempo de swing (3:1 grand jeu, 2:1 putting) et analyse vidéo automatique."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ">=0.9.40 <0.11.0"
  audio_session: ">=0.1.21 <0.3.0"
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  image_picker: ^1.1.0
  # Plugin local (décodage vidéo natif), généré par tool/bootstrap.sh
  rhythmix_native:
    path: packages/rhythmix_native

flutter:
  uses-material-design: true
